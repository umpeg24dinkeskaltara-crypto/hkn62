<style>
  html,body{margin:0;height:100%;background:#F2F7F6;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:linear-gradient(125deg,#027376 0%,#0287A5 55%,#16AF97 100%);color:#fff;
    font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;text-align:center;padding:24px;transition:opacity .5s}
  #splash.hide{opacity:0;pointer-events:none}
  .badge{display:flex;align-items:center;gap:16px;background:#fff;border-radius:20px;padding:14px 22px;box-shadow:0 14px 34px rgba(0,0,0,.18)}
  .badge img.k{height:70px}.badge img.h{height:58px}.badge i{width:1px;height:56px;background:#DCE8E6}
  h1{margin:0;font-size:clamp(22px,4vw,34px);font-weight:800;line-height:1.15}
  h1 span{color:#D2DB2F}
  p{margin:0;opacity:.9;font-size:15px}
  .bar{width:200px;height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
  .bar b{display:block;height:100%;width:40%;border-radius:9px;background:#D2DB2F;animation:ld 1.2s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #slow{display:none;font-size:14px}
  #slow a{color:#D2DB2F;font-weight:700}
  @media (max-width:480px){.badge img.k{height:52px}.badge img.h{height:42px}.badge i{height:42px}}
</style>

<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="badge"><img class="k" src="logo-kaltara.png" alt="Lambang Provinsi Kalimantan Utara"><i></i><img class="h" src="logo-hkn62.png" alt="HKN ke-62 Sehat untuk Semua"></div>
    <h1>Laporan Kegiatan HKN ke-62<br><span>Dinkes Kabupaten/Kota</span></h1>

    <p id="slow">Koneksi lambat? <a id="direct" href="#" target="_top">Buka formulir langsung</a></p>
  </div>

  <iframe id="app" title="Formulir Pelaporan Kegiatan HKN ke-62"
          allow="geolocation; clipboard-write"
          src="https://script.google.com/macros/s/AKfycbzYc3Szh1eJ43m9YD9h1I0Wdo9rWJuYdrLWHuTfhgQ-kn76gM7L5WPrh2-OkWNeX7u_tQ/exec"></iframe>

  <noscript><p style="position:fixed;bottom:20px;width:100%;text-align:center;z-index:3">
    <a href="https://script.google.com/macros/s/AKfycbzYc3Szh1eJ43m9YD9h1I0Wdo9rWJuYdrLWHuTfhgQ-kn76gM7L5WPrh2-OkWNeX7u_tQ/exec">Buka formulir</a></p></noscript>

<script>
  var f = document.getElementById('app'), s = document.getElementById('splash');
  document.getElementById('direct').href = f.src;
  f.addEventListener('load', function () { setTimeout(function () { s.classList.add('hide'); }, 300); });
  setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 9000);
  setTimeout(function () { s.classList.add('hide'); }, 20000);
</script>
</body>
